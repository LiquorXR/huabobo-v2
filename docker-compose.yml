# 生产部署：docker compose up -d --build
# 首次使用先复制 .env.example 为 .env 并填写 DOMAIN / POSTGRES_PASSWORD / JWT_SECRET
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mydb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mydb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-mydb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mydb}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 设置 JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PUBLIC_BASE_URL: https://${DOMAIN:?请在 .env 设置 DOMAIN}
      FRONTEND_BASE_URL: https://${DOMAIN}
      UPLOAD_DIR: /data/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-glm-5.3-flash}
      OPENAI_THINKING: ${OPENAI_THINKING:-}
      OPENAI_TTS_MODEL: ${OPENAI_TTS_MODEL:-glm-tts}
      OPENAI_TTS_VOICE: ${OPENAI_TTS_VOICE:-tongtong}
      OPENAI_TTS_SPEED: ${OPENAI_TTS_SPEED:-1.0}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_BASE_URL: ${ZHIPU_BASE_URL:-}
      ZHIPU_VISION_MODEL: ${ZHIPU_VISION_MODEL:-}
      ZHIPU_TEXT_MODEL: ${ZHIPU_TEXT_MODEL:-}
      ZHIPU_TTS_MODEL: ${ZHIPU_TTS_MODEL:-}
      ZHIPU_TTS_VOICE: ${ZHIPU_TTS_VOICE:-}
      ZHIPU_TTS_SPEED: ${ZHIPU_TTS_SPEED:-}
      ZHIPU_TTS_VOLUME: ${ZHIPU_TTS_VOLUME:-}
      ZHIPU_REASONING_EFFORT: ${ZHIPU_REASONING_EFFORT:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_BASE_URL: ${ARK_BASE_URL:-}
      ARK_VISION_MODEL: ${ARK_VISION_MODEL:-}
      ARK_TEXT_MODEL: ${ARK_TEXT_MODEL:-}
    volumes:
      - uploads-data:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)})\""]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?请在 .env 设置 DOMAIN}
    volumes:
      - ./frontend:/srv:ro
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata: {}
  uploads-data: {}
  caddy-data: {}
  caddy-config: {}
