<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — 指间塑</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <img src="images/logo.png" alt="指间塑 Logo" class="brand-logo" width="44" height="44">
        <div class="brand-text">
          <span class="brand-name">指间塑</span>
          <span class="brand-tag">胶东花饽饽</span>
        </div>
      </a>
      <div class="header-right">
        <button class="nav-toggle" type="button" aria-label="打开菜单">
          <span></span><span></span><span></span>
        </button>
        <nav class="main-nav">
          <a href="index.html">首页</a>
          <a href="huayang.html">馒有花样</a>
          <a href="digital.html">数字化体验</a>
          <a href="gallery.html">数字化展厅</a>
          <a href="artisans.html">合作手艺人</a>
        </nav>
        <div class="header-user">
          <a href="profile.html?id=me" class="nav-mine">我的</a>
          <div class="header-auth-group">
            <a href="login.html" class="btn-auth btn-login">登录</a>
            <a href="register.html" class="btn-auth btn-register">注册</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container" style="max-width: 420px;">
        <h1 class="section-title">登录</h1>
        <p class="section-desc">登录后可进入 3D 面塑 DIY 工作台（拖拽模型、数字人点评、模型导出、AR 融合）。</p>
        <p id="auth-status" class="auth-status">正在检测后台…</p>
        <form class="auth-form" id="login-form" action="#" method="post">
          <label>
            <span>用户名</span>
            <input type="text" name="username" placeholder="2-20 个字符" required minlength="2" maxlength="20">
          </label>
          <label>
            <span>密码</span>
            <input type="password" name="password" placeholder="至少 6 位" required minlength="6">
          </label>
          <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
        </form>
        <p id="auth-error" class="auth-error" hidden></p>
        <p style="margin-top: 16px; font-size: 0.9rem; color: var(--ink-soft); text-align: center;">
          还没有账号？<a href="register.html" style="color: var(--primary); font-weight: 600;">立即注册</a>
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-bottom">
      <p>© 2026 指间塑</p>
    </div>
  </footer>

  <script src="js/site-base.js"></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/api-config.js?v=20260521"></script>
  <script src="js/db-seed.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/api-remote.js?v=20260521" defer></script>
  <script src="js/auth-page.js?v=20260521" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
