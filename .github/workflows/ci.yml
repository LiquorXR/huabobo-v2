name: CI

on:
  push:
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: forbid secrets and junk
        run: |
          tracked_env=$(git ls-files | grep -E '(^|/)\.env$' || true)
          if [ -n "$tracked_env" ]; then echo "tracked .env files:"; echo "$tracked_env"; exit 1; fi
          junk=$(git ls-files | grep -E '__MACOSX|\.DS_Store|\.command$' || true)
          if [ -n "$junk" ]; then echo "junk files tracked:"; echo "$junk"; exit 1; fi
          echo "guards pass"
      - name: forbid oversized binaries
        run: |
          big=$(git ls-files -z | xargs -0 du -b | awk '$1 > 52428800 {print}' || true)
          if [ -n "$big" ]; then echo "files over 50MB:"; echo "$big"; exit 1; fi
          echo "size check pass"
      - name: validate compose
        run: |
          printf 'DOMAIN=ci.local\nPOSTGRES_USER=mydb\nPOSTGRES_DB=mydb\nPOSTGRES_PASSWORD=ci_pass\nJWT_SECRET=ci_secret\n' > .env
          docker compose config -q && echo "compose ok"
          rm -f .env
      - name: required env documented
        run: |
          for v in DOMAIN POSTGRES_PASSWORD JWT_SECRET; do
            grep -q "$v" .env.example || { echo "missing $v in .env.example"; exit 1; }
          done
          echo "env docs ok"
      - name: validate Caddyfile
        run: docker run --rm -e DOMAIN=ci.local -v $PWD/web/Caddyfile:/etc/caddy/Caddyfile:ro caddy:alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node scripts/check-deps.js
      - name: syntax check all js
        run: |
          fail=0
          for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f" || fail=1; done
          exit $fail
      - name: seed + boot + smoke (SQLite)
        run: |
          npm run seed
          (node src/index.js &>/tmp/srv.log & echo $! > /tmp/srv.pid)
          sleep 8
          node scripts/smoke.js; code=$?
          kill $(cat /tmp/srv.pid)
          if [ "$code" != "0" ]; then cat /tmp/srv.log; fi
          exit $code

  backend-pg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zhijiansu
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://zhijiansu:ci_pass@localhost:5432/mydb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: seed + boot + smoke (PostgreSQL)
        run: |
          npm run seed
          (node src/index.js &>/tmp/srv-pg.log & echo $! > /tmp/srv-pg.pid)
          sleep 10
          node scripts/smoke.js; code=$?
          kill $(cat /tmp/srv-pg.pid)
          if [ "$code" != "0" ]; then cat /tmp/srv-pg.log; fi
          exit $code

  backend-offline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:1/nope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: boot without DB + offline smoke (expect 503)
        run: |
          (node src/index.js &>/tmp/srv-off.log & echo $! > /tmp/srv-off.pid)
          sleep 10
          node scripts/smoke-offline.js; code=$?
          kill $(cat /tmp/srv-off.pid)
          if [ "$code" != "0" ]; then cat /tmp/srv-off.log; fi
          exit $code

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node frontend/scripts/check-assets.js

  docker-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zhijiansu
          POSTGRES_PASSWORD: ci_pass
          POSTGRES_DB: mydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build production image
        run: docker build -t backend:ci ./backend
      - name: run image + full smoke against container
        run: |
          docker run -d --name backend-ci --network host \
            -e DATABASE_URL=postgres://zhijiansu:ci_pass@127.0.0.1:5432/mydb \
            -e JWT_SECRET=ci_secret \
            -e PUBLIC_BASE_URL=http://127.0.0.1:3000 \
            -e FRONTEND_BASE_URL=http://127.0.0.1:3000 \
            backend:ci
          sleep 14
          SMOKE_BASE=http://127.0.0.1:3000 node backend/scripts/smoke.js; code=$?
          docker logs backend-ci
          docker rm -f backend-ci
          exit $code

  deploy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: bring up production stack
        run: |
          printf 'DOMAIN=localhost\nPOSTGRES_USER=mydb\nPOSTGRES_DB=mydb\nPOSTGRES_PASSWORD=ci_pass\nJWT_SECRET=ci_secret_0123456789abcdef\n' > .env
          docker compose up -d --build
          docker compose ps
      - name: smoke through Caddy (https, full stack)
        run: |
          for i in $(seq 1 36); do
            if curl -sk https://localhost/api/health | grep -q '"db":"connected"'; then break; fi
            sleep 5
          done
          curl -sk https://localhost/api/health
          curl -sk https://localhost/ -o /dev/null -w "frontend %{http_code}\n"
          NODE_TLS_REJECT_UNAUTHORIZED=0 SMOKE_BASE=https://localhost node backend/scripts/smoke.js
      - name: dump logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: tear down
        if: always()
        run: docker compose down -v
